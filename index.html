<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>kongdao</title>
  <meta name="theme-color" content="#101c23">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="空島">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <style>
        /* 顏色都寫成變數，切換主題時只要換變數 */
    :root {
      --bg: #fafafa; --card: #ffffff; --text: #1c2a31; --muted: #666666;
      --line: #dddddd; --accent: #a8236f; --hover: #f3e4ee;
      --green: #2c7a4b; --orange: #b26b00; --red: #c0392b;
    }
    body.dark {
      --bg: #101c23; --card: #16232a; --text: #e4ecee; --muted: #93a6ad;
      --line: #2a3d47; --accent: #ff6bb5; --hover: #2a2232;
      --green: #56d18a; --orange: #f0b04a; --red: #ff7a6b;
    }
    html, body { margin: 0; height: 100%; font-family: "Microsoft JhengHei", sans-serif; color: var(--text); background: var(--bg); }
    #app { display: flex; height: 100%; }
    #map { flex: 1; }
    #clock {
      position: absolute; top: 12px; left: 12px;
      background: var(--card); color: var(--text); padding: 6px 12px; border-radius: 4px;
      font: 600 16px monospace; box-shadow: 0 1px 4px rgba(0,0,0,.2);
    }
    #themeBtn {
      position: absolute; top: 52px; left: 12px;
      background: var(--card); color: var(--text); border: 1px solid var(--line);
      padding: 4px 12px; border-radius: 4px; cursor: pointer; font-size: 13px;
    }
    #panel { width: 320px; display: flex; flex-direction: column; border-left: 1px solid var(--line); background: var(--bg); }
    #info { padding: 14px; border-bottom: 1px solid var(--line); min-height: 130px; }
    #info button { margin-top: 10px; padding: 6px 14px; cursor: pointer; background: var(--card); color: var(--text); border: 1px solid var(--line); border-radius: 4px; }
    .tabs { display: flex; }
    .tabs button { flex: 1; padding: 10px; border: 0; border-bottom: 2px solid transparent; background: none; cursor: pointer; font-size: 15px; color: var(--muted); }
    .tabs button.on { border-color: var(--accent); color: var(--text); font-weight: bold; }
    #board { flex: 1; overflow-y: auto; position: relative; }
    .row { display: grid; grid-template-columns: 52px 76px 1fr auto; gap: 6px; padding: 8px 12px; font-size: 14px; cursor: pointer; }
    .row:hover { background: var(--hover); }
    .row.past { opacity: .45; }
    .old { display: block; font-size: 11px; color: var(--muted); text-decoration: line-through; }
    .status { font-size: 12px; padding: 1px 8px; border: 1px solid; border-radius: 10px; }
    #credit { padding: 8px 14px; font-size: 11px; line-height: 1.6; color: var(--muted); border-top: 1px solid var(--line); }
    #clock.warn { color: var(--red); }
    #stats { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
    .stat { font-size: 12px; padding: 2px 8px; border-radius: 10px; border: 1px solid var(--line); white-space: nowrap; }
    .stat b { font-size: 14px; margin-left: 2px; }
    #weather { padding: 10px 14px; font-size: 13px; line-height: 1.7; border-bottom: 1px solid var(--line); }
    #weather button { margin-left: 6px; font-size: 12px; padding: 2px 8px; cursor: pointer; background: var(--card); color: var(--text); border: 1px solid var(--line); border-radius: 4px; }
    #fogAlert {
      position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
      background: var(--orange); color: var(--bg); padding: 8px 14px; border-radius: 6px;
      font-size: 14px; font-weight: bold; box-shadow: 0 2px 8px rgba(0,0,0,.25);
      max-width: 70vw; text-align: center;
    }
    #fogAlert.severe { background: var(--red); }
    #handle { display: none; }

    /* ===== 手機版：底部抽屜蓋在地圖上 ===== */
    @media (max-width: 700px) {
      html, body { overflow: hidden; overscroll-behavior: none; }
      #app { display: block; height: 100%; }
      #map { position: absolute; inset: 0; }        /* 地圖永遠全螢幕 */

      #panel {
        position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
        width: auto; height: 45vh;
        border: 0; border-radius: 16px 16px 0 0;
        box-shadow: 0 -4px 16px rgba(0,0,0,.25);
        padding-bottom: env(safe-area-inset-bottom);
        transition: height .25s ease;
      }
      #panel.dragging { transition: none; }          /* 拖曳時跟著手指，不要動畫 */
      #panel > * { flex-shrink: 0; }                 /* 上面的區塊不准被壓扁 */
      #panel #board { flex: 1 1 auto; min-height: 0; } /* 剩下的空間都給看板，可以捲動 */

      #handle {
        display: flex; justify-content: center; padding: 10px 0 6px;
        cursor: grab; touch-action: none;            /* 讓手指拖曳不會捲動頁面 */
      }
      #handle span { width: 44px; height: 5px; border-radius: 3px; background: var(--muted); opacity: .6; }
      #info { min-height: 0; padding: 4px 16px 10px; touch-action: none; }

      #clock {
        top: calc(8px + env(safe-area-inset-top)); left: 8px;
        font-size: 12px; padding: 4px 8px;
        max-width: calc(100vw - 16px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      #themeBtn { top: calc(44px + env(safe-area-inset-top)); left: 8px; }
      #fogAlert { top: calc(84px + env(safe-area-inset-top)); max-width: 90vw; font-size: 13px; }
      .row { padding: 11px 14px; }
    }

  </style>
</head>
<body>
  <div id="app">
    <div id="map"></div>
    <aside id="panel">
      <div id="handle"><span></span></div>
      <div id="info"></div>
      <div id="weather">金門天氣載入中…</div>
      <div id="stats"></div>
      <div class="tabs">
        <button id="tabDep" class="on">出發</button>
        <button id="tabArr">抵達</button>
      </div>
      <div id="board"></div>
      <div id="credit">
        航班資料：交通部 TDX 運輸資料流通服務<br>
        天氣資料：交通部中央氣象署（金門站）<br>
        實際起降時間請以航空公司公告為準
      </div>
    </aside>
  </div>
  <div id="clock">--:--</div>
  <div id="fogAlert" hidden></div>
  <button id="themeBtn">暗色地圖</button>
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="schedule.js"></script>
  <script src="app.js"></script>
</body>
</html>
