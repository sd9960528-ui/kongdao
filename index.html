<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>kongdao</title>
  <meta name="theme-color" content="#101c23">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="空島">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <style>
        /* 顏色都寫成變數，切換主題時只要換變數 */
    :root {
      --bg: #fafafa; --card: #ffffff; --text: #1c2a31; --muted: #666666;
      --line: #dddddd; --accent: #a8236f; --hover: #f3e4ee;
      --green: #2c7a4b; --orange: #b26b00; --red: #c0392b;
    }
    body.dark {
      --bg: #101c23; --card: #16232a; --text: #e4ecee; --muted: #93a6ad;
      --line: #2a3d47; --accent: #ff6bb5; --hover: #2a2232;
      --green: #56d18a; --orange: #f0b04a; --red: #ff7a6b;
    }
    html, body { margin: 0; height: 100%; font-family: "Microsoft JhengHei", sans-serif; color: var(--text); background: var(--bg); }
    #app { display: flex; height: 100%; }
    #map { flex: 1; }
    #clock {
      position: absolute; top: 12px; left: 12px;
      background: var(--card); color: var(--text); padding: 6px 12px; border-radius: 4px;
      font: 600 16px monospace; box-shadow: 0 1px 4px rgba(0,0,0,.2);
    }
    #themeBtn {
      position: absolute; top: 52px; left: 12px;
      background: var(--card); color: var(--text); border: 1px solid var(--line);
      padding: 4px 12px; border-radius: 4px; cursor: pointer; font-size: 13px;
    }
    #panel { width: 320px; display: flex; flex-direction: column; border-left: 1px solid var(--line); background: var(--bg); }
    #info { padding: 14px; border-bottom: 1px solid var(--line); min-height: 130px; }
    #info button { margin-top: 10px; padding: 6px 14px; cursor: pointer; background: var(--card); color: var(--text); border: 1px solid var(--line); border-radius: 4px; }
    .tabs { display: flex; }
    .tabs button { flex: 1; padding: 10px; border: 0; border-bottom: 2px solid transparent; background: none; cursor: pointer; font-size: 15px; color: var(--muted); }
    .tabs button.on { border-color: var(--accent); color: var(--text); font-weight: bold; }
    #board { flex: 1; overflow-y: auto; position: relative; }
    .row { display: grid; grid-template-columns: 52px 76px 1fr auto; gap: 6px; padding: 8px 12px; font-size: 14px; cursor: pointer; }
    .row:hover { background: var(--hover); }
    .row.past { opacity: .45; }
    .old { display: block; font-size: 11px; color: var(--muted); text-decoration: line-through; }
    .status { font-size: 12px; padding: 1px 8px; border: 1px solid; border-radius: 10px; }
    #handle { display: none; }
    #credit { padding: 8px 14px; font-size: 11px; line-height: 1.6; color: var(--muted); border-top: 1px solid var(--line); }
    #clock.warn { color: var(--red); }

    /* 手機版 */
    @media (max-width: 700px) {
      html, body { overflow: hidden; overscroll-behavior: none; }
      #app { flex-direction: column; }
      #panel {
        width: auto; height: 42%;
        border-left: 0; border-top: 1px solid var(--line);
        padding-bottom: env(safe-area-inset-bottom);   /* 避開 iPhone 底部的橫條 */
        transition: height .25s;
      }
      #panel.collapsed { height: 140px; }               /* 收起時只露出一小段 */
      #handle { display: flex; justify-content: center; padding: 8px 0 4px; cursor: pointer; }
      #handle span { width: 40px; height: 5px; border-radius: 3px; background: var(--line); }
      #info { min-height: 0; padding: 8px 14px; }
      #clock {
        top: calc(8px + env(safe-area-inset-top)); left: 8px;   /* 避開瀏海 */
        font-size: 13px; padding: 4px 8px; max-width: calc(100vw - 32px);
      }
      #themeBtn { top: calc(48px + env(safe-area-inset-top)); left: 8px; }
      .row { padding: 11px 12px; }                      /* 每一列高一點，手指比較好點 */
    }
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="map"></div>
    <aside id="panel">
      <div id="handle"><span></span></div>
      <div id="info"></div>
      <div class="tabs">
        <button id="tabDep" class="on">出發</button>
        <button id="tabArr">抵達</button>
      </div>
      <div id="board"></div>
      <div id="credit">
        航班資料：交通部 TDX 運輸資料流通服務<br>
        實際起降時間請以航空公司公告為準
      </div>
    </aside>
  </div>
  <div id="clock">--:--</div>
  <button id="themeBtn">暗色地圖</button>
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="schedule.js"></script>
  <script src="app.js"></script>
</body>
</html>
